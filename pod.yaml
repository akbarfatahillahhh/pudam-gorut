apiVersion: v1
kind: Pod
metadata:
  name: pudam-ekas
  labels:
    app: pudam-ekas
spec:
  restartPolicy: always
  containers:
    - name: app
      image: localhost/pudam-ekas-app:dev
      ports:
        - containerPort: 80
          hostPort: 8092
      volumeMounts:
        - name: src
          mountPath: /var/www/html
          readOnly: false
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10

  volumes:
    - name: src
      hostPath:
        path: /home/reev/project/pudam_ekas
        type: Directory
